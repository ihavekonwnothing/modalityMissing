model:
  name: smagnet
  architecture: smagnet
  encoder: resnet34
  encoder_name: resnet34
  encoder_depth: 5
  encoder_weights_sar: null
  encoder_weights_msi: null
  sar_in_channels: 2
  optical_in_channels: 4
  opt_mask_channels: 1
  num_classes: 1
  decoder_channels: [256, 128, 64, 32, 16]
  decoder_use_batchnorm: false
  decoder_attention_type: null
  sarmsiff_method: sar_msi_gated
  enable_spatial_mask: true
  lambda_sar: 0.3
  inference_mode: adaptive_fallback
  input_bands:
    sar: [VV, VH]
    optical: [Blue, Green, Red, NIR]

output_dir: outputs/s1s2_water/baselines/smagnet_ddp

dataset:
  name: s1s2_water
  root_env: S1S2_WATER_ROOT
  patch_size: 512
  use_sar: true
  use_optical: true
  use_slope: false
  ignore_invalid_pixels: true
  stats_samples_per_scene: 2
  train_sampling: tiles
  train_stride: null
  eval_stride: null
  patches_per_scene_per_epoch: 16
  exclude_scenes: [31]
  cache_dir: data/s1s2_water_patch_cache_512

training:
  epochs: 100
  batch_size: 16
  optimizer: AdamW
  lr: 0.001
  weight_decay: 0.01
  early_stopping:
    enabled: true
    monitor: val_IoU
    patience: 20
    min_epochs: 30
    min_delta: 0.0005
  lr_scheduler:
    type: reduce_on_plateau
    factor: 0.5
    patience: 8
    threshold: 0.001
    min_lr: 0.000001
  seed: 4
  deterministic: true
  num_workers: 16
  resume: true
  amp:
    enabled: true
    dtype: bfloat16

robust_fusion:
  enabled: true
  p_clean: 0.25
  p_optical_partial_missing: 0.45
  p_optical_full_missing: 0.30
  mask_ratios: [0.25, 0.50, 0.75]
  mask_types: [random_block, cloud_like]

loss:
  bce_pos_weight: auto
  dice: true

metrics:
  - IoU
  - F1
  - Precision
  - Recall
