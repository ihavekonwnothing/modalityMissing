model:
  name: late_fusion_unet
  architecture: late_fusion_unet
  encoder: custom_lightweight
  encoder_weights: null
  sar_in_channels: 2
  optical_in_channels: 4
  num_classes: 1
  input_bands:
    sar: [VV, VH]
    optical: [Blue, Green, Red, NIR]

dataset:
  name: s1s2_water
  root_env: S1S2_WATER_ROOT
  patch_size: 512
  use_sar: true
  use_optical: true
  use_slope: false
  ignore_invalid_pixels: true
  stats_samples_per_scene: 2
  train_sampling: tiles
  train_stride: null
  eval_stride: null
  patches_per_scene_per_epoch: 16

training:
  epochs: 100
  batch_size: 16
  optimizer: AdamW
  lr: 0.001
  weight_decay: 0.01
  early_stopping:
    enabled: false
    monitor: val_IoU
    patience: 20
    min_epochs: 30
    min_delta: 0.0005
  lr_scheduler:
    type: reduce_on_plateau
    factor: 0.5
    patience: 8
    threshold: 0.001
    min_lr: 0.000001
  seed: 4
  deterministic: true
  num_workers: 64

loss:
  bce_pos_weight: auto
  dice: true

metrics:
  - IoU
  - F1
  - Precision
  - Recall
